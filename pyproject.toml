[project]
name = "student-management-system"
version = "0.1.0"
description = "A beginner-friendly Student Management System with FastAPI and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
standard = [
    "uvicorn[standard]>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*httpx.*",
]

